# OpenSpec project configuration for a Terraform module repository
# (template from the profiles repository, profile terraform-module).
# `context` is injected into every planning artifact; keep it to what is
# specific to THIS module. Engineering standards are not repeated here: they
# are fetched on demand from the referenced stores (quality, repository, terraform) (see the index that
# `openspec instructions` prints). `mise run spec-setup` registers the stores.
schema: spec-driven

# `ref` pins each store to a released tag (openspec-consumption); the setup
# script clones at that tag and reports a registered checkout on another commit.
references:
  - id: quality
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/quality.git
    ref: v1.2.6
  - id: repository
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/repository.git
    ref: v4.1.0
  - id: terraform
    remote: https://gitlab.com/leminnov/agentic-coding/openspec/terraform.git
    ref: v1.2.6

context: |
  Quality mandate: every artifact applies the non-negotiables of AGENTS.md
  (simple, efficient, secure, production-level) and cites the quality-store
  specs that decided something.

  Project: OpenTofu/Terraform module that creates Scaleway Compute
  infrastructure from one `instances` map of instance groups: servers
  (count per group, named <name>-<group>-NN), a public IP per server, a shared
  security group plus optional per-group security groups with merged rules,
  private network attachment, additional SBS / local volumes and external
  volumes, an optional placement group, optional backup snapshots and an
  optional IAM SSH key. The Scaleway project is looked up by name. Published on
  GitLab (leminnov/terraform/modules/scaleway-compute); consumers pin a git tag
  (?ref=vX.Y.Z). Apache-2.0.

  Stack: HCL only. required_version >= 1.10.7. Provider pinned with ~> in
  versions.tf: scaleway/scaleway ~> 2.86. Every tool is pinned in mise.toml.

  Layout: one .tf file per theme: main.tf (servers, snapshots), network.tf
  (public IPs, security groups and rules), storage.tf (SBS and local volumes),
  placement.tf, iam.tf (SSH key), data.tf (project lookup), locals.tf
  (flattening of groups into servers and volumes, tag and security group
  resolution). variables.tf is the whole input contract (validation blocks for
  enums and formats); outputs.tf exposes IDs and addresses. There is no
  checks.tf: cross-input rules are resource preconditions in main.tf and
  iam.tf. tests/*.tftest.hcl are unit tests with mock_provider "scaleway"
  (conditional_creation, instance_flattening, validations); there is no
  integration fixture. examples/minimal and examples/complete are the examples.

  Module-specific conventions (the generic ones are standards in the quality,
  repository and terraform stores, fetched on demand): instances are expanded
  with for_each over a flattened map keyed <group>-<NN>; resource names are
  prefixed with the `name` input; security group priority is external
  security_group_id > per-group group > shared group; README tables are
  generated by terraform-docs; CHANGELOG.md is generated by git-cliff from
  commit subjects (mise run changelog, .cliff.toml), never edited by hand, so
  commit subjects read as CHANGELOG lines; semver tags.

  Commands: tofu fmt -recursive; tofu init -backend=false && tofu validate;
  tflint --recursive; tofu test; pre-commit run -a; mise run changelog;
  mise run spec-validate.

  Standards: fetch the referenced-store specs listed in these instructions
  whose id matches the area touched, and cite the ones applied.

rules:
  proposal:
    - Classify the change as semver major/minor/patch per terraform-versioning and list every input or output whose type, default or meaning changes
    - State what lands in state; a new secret-bearing input must follow terraform-security (write-only argument plus *_wo_version) or justify why it cannot
  specs:
    - Reuse the existing capability directories under openspec/specs (module-contract, input-validation, runtime-checks, lifecycle-management, resource-timeouts, instances, security-groups, networking, storage-volumes, placement-groups, ssh-keys); add a new one only for a new module area
    - Write requirements against the module's observable contract (input shape, validation errors, resources produced, outputs, check warnings, empty second plan), not against provider internals
    - Give every validation block and every check block a scenario with the rejected or warned input
  design:
    - Name the resources and arguments used and the provider version that introduced them
    - Explain how the change avoids a perpetual diff and how existing state migrates (moved blocks, in-place update or forced replacement)
    - Keep provider {} and backend {} out of the module and never shell out to a CLI
  tasks:
    - Include unit tests in tests/ (a new run in the matching *.tftest.hcl, with mock_provider "scaleway"; a rejected-input run for every new validation) and examples/complete plus any example the change affects
    - Include tofu fmt -recursive, tofu validate, tflint --recursive, tofu test and pre-commit run -a (terraform-docs README regeneration)
    - Include a commit subject that reads as the CHANGELOG.md line (git-cliff generates the file; do not edit it), with upgrade notes in the README for anything breaking

operations:
  apply:
    guidance:
      - Apply the quality store (simplicity, efficiency, security, production-readiness) to every task; fetch terraform-code-style, terraform-variables and terraform-outputs from the terraform store before editing HCL; flag any deviation with a DEVIATION(<spec-id>) comment
      - Run tofu fmt -recursive, tofu validate and tofu test after each task group and do not mark a task done while they fail
      - Report test and scanner output as-is, including failures
  archive:
    guidance:
      - Confirm the commit subject reads as a CHANGELOG line (regenerate CHANGELOG.md with `mise run changelog` at release) and the terraform-docs README block was updated before archiving
      - Summarize which main specs changed and any requirement that was removed
